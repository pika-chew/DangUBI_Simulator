# Docker 호스트에서 수동 실행하는 공통 구성. AWS 리소스는 생성하지 않는다.
services:
  simulator:
    image: ${DANGUBI_IMAGE:?DANGUBI_IMAGE에 검증한 이미지 태그 또는 digest를 지정하세요}
    user: "10001:10001"
    read_only: true
    init: false # 제품 이미지의 tini를 사용한다.
    restart: "no"
    stop_grace_period: 30s
    cpus: ${DANGUBI_CPUS:-4}
    mem_limit: ${DANGUBI_MEMORY:-4g}
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${DANGUBI_HTTP_PORT:-8081}:8080"
    environment:
      DANGUBI_DATA_DIR: /data
      DANGUBI_MQTT_PROFILE: /run/secrets/mqtt.json
    volumes:
      - simulator-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  simulator-data:
